# 공통 설정(design/conventions.md §4). 환경별 값은 application-{local,staging,prod}.yml, 비밀값은 환경변수(.env / k8s Secret).
spring:
  application:
    name: data2flow-action
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  lifecycle:
    # 종료 순서(reliability-and-ha.md §4): 큐 소비 중지 → 처리 중 메시지 완료·ACK → 아웃박스 마지막 릴레이 → 연결 종료
    timeout-per-shutdown-phase: 30s
  # 기준 저장소: s3 공용 PostgreSQL DB data2flow, 스키마 data2flow_action(ADR-019, erd/action.md). 값은 환경변수
  datasource:
    url: jdbc:postgresql://${DATA2FLOW_DB_HOST:localhost}:${DATA2FLOW_DB_PORT:5432}/${DATA2FLOW_DB_NAME:data2flow}?ApplicationName=data2flow-action
    username: ${DATA2FLOW_DB_USERNAME:data2flow}
    password: ${DATA2FLOW_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    schemas: data2flow_action
    default-schema: data2flow_action
    create-schemas: true
  # RabbitMQ AMQP(s4, vhost: prod data2flow · staging data2flow-stg · local data2flow-dev, ADR-020·030)
  rabbitmq:
    host: ${DATA2FLOW_RABBITMQ_HOST:localhost}
    port: ${DATA2FLOW_RABBITMQ_PORT:5672}
    virtual-host: ${DATA2FLOW_RABBITMQ_VHOST:data2flow-dev}
    username: ${DATA2FLOW_RABBITMQ_USERNAME:guest}
    password: ${DATA2FLOW_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    connection-timeout: 5s
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  messages:
    basename: messages,messages-sink,messages-notification
    encoding: UTF-8
    fallback-to-system-locale: false
server:
  port: 8080
  shutdown: graceful

# actuator는 8081(프로브·지표 전용, k8s Service로 노출하지 않음)
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit
  metrics:
    tags:
      application: ${spring.application.name}

data2flow:
  action:
    env: ${DATA2FLOW_ACTION_ENV:dev}
    # 파드 이름(MQTT client-id 순번)
    instance-id: ${HOSTNAME:action-local-0}
    flyway-mode: validate
    core-uri: ${DATA2FLOW_CORE_URI:http://data2flow-core-api}
    simulator-uri: ${DATA2FLOW_SIMULATOR_URI:http://data2flow-simulator}
    profile-ttl: 30s
    scheduler:
      enabled: true
      period: 1s
      batch: 100
    outbox:
      relay-enabled: true
      interval: 1s
      batch-size: 100
      retention: 7d
    command:
      ack-timeout: 30s
      apply-timeout: 60s
      retry-max-attempts: 3
      retry-initial: 1s
      retry-multiplier: 2
      retry-max: 10s
      wait-max: 10s
      default-validity: 600s
    # MQTT 일반 드라이버(ACT-03.02). ⏸ 결정 대기: 공용 플랫폼 브로커(iot-data.java21.net)에는 명령을 발행하지 않는다(CLAUDE.md §5).
    # 기본 꺼짐이고, 켜도 공용 브로커 주소는 거부한다. 지금은 Testcontainers Mosquitto로만 쓴다
    mqtt:
      enabled: false
      host: ${DATA2FLOW_ACTION_MQTT_HOST:}
      port: ${DATA2FLOW_ACTION_MQTT_PORT:1883}
      denied-hosts: iot-data.java21.net
      qos: 1
    # LoRaWAN 다운링크(ACT-03.03). ⏸ 결정 대기: 공용 ChirpStack(s3.java21.net)에 다운링크를 넣지 않는다(CLAUDE.md §5).
    # 기본 꺼짐이고, 켜도 공용 ChirpStack·공용 브로커 주소는 거부한다. 지금은 ChirpStack API 목(MockWebServer)으로만 시험한다
    lorawan:
      enabled: ${DATA2FLOW_ACTION_LORAWAN_ENABLED:false}
      timeout: 5s
    # 클라우드 벤더 드라이버(ACT-03.04). 키가 없어 기본 꺼짐("준비 중", ADR-040)
    vendors:
      lg-thinq:
        enabled: ${DATA2FLOW_ACTION_LG_THINQ_ENABLED:false}
        base-url: https://api-kic.lgthinq.com
      smart-things:
        enabled: ${DATA2FLOW_ACTION_SMARTTHINGS_ENABLED:false}
        base-url: https://api.smartthings.com
    # 제어 효과 확인(ACT-08.01)·가동 집계(ACT-08.02)
    effect:
      min-change: 0.2
      zone: Asia/Seoul
    # Sink(FLW-04, BR-FLW-28): 연결마다 작은 풀, 일시 장애는 1초부터 2배·최대 60초 간격으로 6시간까지 재시도, dead-letter 24시간
    sink:
      connection-ttl: 5m
      pool-size: 2
      connect-timeout: 5s
      retry-initial: 1s
      retry-max: 60s
      max-retry-age: 6h
      dead-retention: 24h
      written-retention: 7d
      lease: 60s
      batch: 50
