# 시험 프로필: Testcontainers PostgreSQL·RabbitMQ, 가짜 core·simulator(MockWebServer). 주기 작업은 끄고 시험이 직접 부른다
data2flow:
  action:
    env: test
    flyway-mode: migrate
    scheduler:
      enabled: false
    outbox:
      relay-enabled: false
    # 출력 연결(M5): 스트림 소비는 스트림 IT만 켜고, 발송·지표·정리 작업은 시험이 직접 부른다
    output:
      consumer-enabled: false
      sender-enabled: false
    # 알림(M4): 텔레그램 어댑터는 시험에서만 켠다(주소는 FakeTelegram MockWebServer, api.telegram.org는 부르지 않음)
    notification:
      telegram:
        enabled: true
logging:
  level:
    net.java21.data2flow: INFO
